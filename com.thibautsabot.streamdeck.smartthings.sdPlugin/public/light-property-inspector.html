<!DOCTYPE html>
<html lang="en">
    <head>
        <title>com.thibautsabot.streamdeck.smartthings.light.pi</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="sdpi.css">
        <link rel="stylesheet" href="oauth-ui.css">
        <script src="./dist/light-property-inspector-bundle.js"></script>
    </head>
    <body>
        <div class="sdpi-wrapper" id="mainSettings">
            <!-- OAuth UI injected here by JavaScript -->

            <div class="sdpi-item">
                <div class="sdpi-item-label" id="select_label">Devices</div>
                <select class="sdpi-item-value select" id="select_value"></select>
            </div>
            <div class="sdpi-item">
                <div class="sdpi-item-label">Behaviour</div>
                <fieldset>
                    <legend>Select a behaviour</legend>
                    <div>
                        <input type="radio" id="toggle" name="behaviour" value="toggle" checked>
                        <label for="toggle">Toggle</label><br/>
                        <span id="more-option">
                            <input type="radio" id="more" name="behaviour" value="more">
                            <label for="more">Brighter</label><br/>
                        </span>
                        <span id="less-option">
                            <input type="radio" id="less" name="behaviour" value="less">
                            <label for="less">Darker</label>
                        </span>
                    </div>
                </fieldset>
            </div>
        </div>
    </body>
</html>
